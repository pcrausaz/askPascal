name: Deploy Quartz site to GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0 # git history is needed for accurate page dates

      - uses: actions/setup-node@v7
        with:
          node-version: 22

      # No .quartz/plugins cache: a cache hit makes the installer skip the
      # local plugin's own npm install, which then fails to load at build time.
      - run: npm ci

      - name: Install Quartz plugins
        run: npx quartz plugin install --from-config

      - name: Build
        run: npx quartz build

      - name: Optimize images
        run: node scripts/optimize-images.mjs public

      - name: Verify build
        run: |
          set -e
          fail() { echo "::error::$1"; exit 1; }
          test -f public/recipes/apricot-sous-vide.html || fail "missing lowercase recipe page"
          test -f public/Recipes/Apricot-Sous-Vide.html || fail "missing case-redirect for old URL"
          grep -q 'http-equiv="refresh"' public/Recipes/Apricot-Sous-Vide.html || fail "old-case file is not a redirect"
          test -f public/index.html || fail "missing root index.html"
          test -f public/CNAME || fail "missing CNAME"
          count=$(grep -rl "column-content" public/recipes/ | wc -l)
          [ "$count" -gt 200 ] || fail "only $count recipe pages have columns (expected >200)"
          imgs=$(grep -o '<img' public/askpascal/photo-album.html | wc -l)
          [ "$imgs" -gt 50 ] || fail "photo album has only $imgs images (expected >50)"
          test -f public/tags/recipe.html || fail "missing tag page"
          echo "All verification checks passed."
          du -sh public

      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v5
        with:
          path: public

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v5
